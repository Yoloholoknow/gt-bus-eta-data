name: Pull data from Fly

on:
  schedule:
    - cron: "0 9 * * *"  # daily, 09:00 UTC (5am Eastern)
  workflow_dispatch:      # "Run workflow" button for manual pulls

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updated-data
          fetch-depth: 0  # full history so we can compare against main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Download stop timings from the Fly volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console -a gt-bus-eta-data -C "tar czf - -C /app data/stops_timings" | tar xzf -

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/stops_timings
          git diff --cached --quiet && echo "No new data" && exit 0
          git commit -m "data: daily pull $(date -u +%F)"
          git push origin updated-data

      - name: Open or update PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "Nothing to merge"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --head updated-data --base main --state open --json number -q '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating new PR..."
            PR_URL=$(gh pr create --head updated-data --base main \
              --title "Data update $(date -u +%F)" \
              --body "Automated daily pull of \`data/stops_timings\` from Fly.")
            PR_TARGET="$PR_URL"
          else
            echo "PR #$PR_NUMBER already open; updating target..."
            PR_TARGET="$PR_NUMBER"
          fi

          echo "Enabling auto-merge for $PR_TARGET..."
          gh pr merge "$PR_TARGET" --auto --squash
